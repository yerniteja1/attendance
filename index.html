<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Manpower Allocation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
      background: #f1f5f9;
      color: #0f172a;
      padding-bottom: 84px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 6px;
    }

    h2 {
      margin: 0;
      font-size: 1.02rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .date-input {
      padding: 5px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.72rem;
      background: #fff;
      color: #1e293b;
      font-weight: 600;
      width: 106px;
    }

    .shift-btn,
    .admin-btn,
    .sync-btn {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.73rem;
      cursor: pointer;
      color: #1e293b;
      white-space: nowrap;
    }

    .admin-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .sync-btn.dirty {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .sync-btn.synced {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    /* Collapsible Admin Panel */
    .admin-panel {
      display: none;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .admin-panel.open {
      display: block;
    }

    .admin-title {
      font-size: 0.8rem;
      font-weight: 700;
      margin: 0 0 8px;
      color: #334155;
    }

    .add-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .add-grid input {
      grid-column: span 2;
    }

    input,
    select {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.8rem;
      background: #fff;
    }

    .add-btn {
      grid-column: span 2;
      padding: 9px;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .sheet-url-row {
      display: flex;
      gap: 5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }

    .sheet-url-row input {
      flex: 1;
      font-size: 0.74rem;
    }

    .tool-btn {
      padding: 7px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      color: #334155;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 9px;
    }

    .f-btn {
      border: none;
      background: transparent;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }

    .f-btn.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .counts {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
    }

    .machines-box {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .machines-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748b;
      margin-right: 2px;
    }

    .m-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      padding: 0;
    }

    .m-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .group-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin: 14px 0 6px 2px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 7px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      gap: 5px;
    }

    .name {
      font-weight: 600;
      font-size: 0.92rem;
      flex: 1;
    }

    .badge-shift {
      padding: 3px 7px;
      font-size: 0.71rem;
      font-weight: 800;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }

    .shift-a {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .shift-b {
      background: #e0e7ff;
      color: #3730a3;
      border-color: #c7d2fe;
    }

    .role-select {
      padding: 3px 5px;
      font-size: 0.73rem;
      border-radius: 6px;
      color: #475569;
      background: #f8fafc;
    }

    .icon-btn {
      border: none;
      background: transparent;
      font-size: 1rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      display: none;
    }

    .edit-btn {
      color: #2563eb;
    }

    .del-btn {
      color: #dc2626;
      font-size: 1.15rem;
    }

    body.admin-mode .icon-btn {
      display: inline-block;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .st-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 6px 4px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.76rem;
      color: #334155;
      text-align: center;
    }

    .active-hw {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }

    .active-ht {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .active-a {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }

    .actions {
      display: flex;
      gap: 8px;
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 492px;
    }

    .wa-btn {
      flex: 2;
      padding: 13px;
      background: #16a34a;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .copy-btn {
      flex: 1;
      padding: 13px;
      background: #0f172a;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Manpower</h2>
    <div class="header-controls">
      <input type="date" class="date-input" id="shiftDate" />
      <button class="shift-btn" id="shiftToggle" onclick="toggleDayNight()"></button>
      <button class="sync-btn" id="syncBtn" onclick="syncNow()" title="Sync with Google Sheet">☁️ Sync</button>
      <button class="admin-btn" id="adminToggle" onclick="toggleAdmin()">⚙️</button>
    </div>
  </div>

  <!-- Collapsible Admin Drawer -->
  <div class="admin-panel" id="adminPanel">
    <div class="admin-title">Add Worker (Default Settings)</div>
    <div class="add-grid">
      <input id="newName" placeholder="Worker full name..." onkeydown="if(event.key==='Enter') addWorker()" />
      <select id="newRole">
        <option value="Operators">Role: Operators</option>
        <option value="Mixers" selected>Role: Mixers</option>
        <option value="Cutting">Role: Cutting</option>
        <option value="Shifting">Role: Shifting</option>
        <option value="Grinding">Role: Grinding</option>
        <option value="RUC">Role: RUC</option>
        <option value="Others">Role: Others</option>
      </select>
      <select id="newShift">
        <option value="A" selected>Shift: A</option>
        <option value="B">Shift: B</option>
      </select>
      <select id="newStatus">
        <option value="HW" selected>Default: Hiwood</option>
        <option value="HT">Default: HiTech</option>
        <option value="A">Default: Absent</option>
      </select>
      <button class="add-btn" onclick="addWorker()">+ Add Worker</button>
    </div>

    <div class="sheet-url-row">
      <input id="sheetUrlInput" placeholder="Paste Google Apps Script /exec URL..." />
      <button class="tool-btn" onclick="saveSheetUrl()">Save URL</button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="f-btn active" data-f="ALL" onclick="setFilter('ALL')">All Shifts</button>
    <button class="f-btn" data-f="A" onclick="setFilter('A')">Shift A</button>
    <button class="f-btn" data-f="B" onclick="setFilter('B')">Shift B</button>
  </div>

  <div class="meta-bar">
    <div class="counts" id="counts"></div>
    <div class="machines-box">
      <span class="machines-label">Mc:</span>
      <button class="m-btn" data-m="1" onclick="toggleMachine(1)">1</button>
      <button class="m-btn" data-m="2" onclick="toggleMachine(2)">2</button>
      <button class="m-btn" data-m="3" onclick="toggleMachine(3)">3</button>
      <button class="m-btn" data-m="4" onclick="toggleMachine(4)">4</button>
      <button class="m-btn" data-m="5" onclick="toggleMachine(5)">5</button>
    </div>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button class="wa-btn" onclick="sendWhatsApp()">Send to WhatsApp</button>
    <button class="copy-btn" onclick="copyText()">Copy</button>
  </div>

  <script>
    const ROLES = ["Operators", "Mixers", "Cutting", "Shifting", "Grinding", "RUC", "Others"];

    // Optional: Paste your Apps Script Web App URL here to pre-configure for all devices
    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxv_vjPLdRqMYU2_WnXlZIfp5oqtpESEUUOu2L9noh1jxwdFvmEzz4R57tDsvBAcC-C/exec";

    const now = new Date();
    const localISO = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split("T")[0];
    document.getElementById("shiftDate").value = localISO;

    // Clear any previously stored script URL so the hard‑coded one is used
    localStorage.removeItem("hw_v8_script_url");

    let isDayShift = now.getHours() >= 8 && now.getHours() < 20;
    let activeFilter = localStorage.getItem("hw_v8_filter") || "ALL";
    let isAdminOpen = false;
    let hasUnsyncedChanges = localStorage.getItem("hw_v8_dirty") === "true";

    const defaultWorkers = [
      { name: "Chinnilal Mahato", role: "Operators", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Ranjeet Yadav", role: "Operators", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Chandan Mahato", role: "Operators", shift: "A", status: "HT", updatedAt: 1 },
      { name: "Madhusudan", role: "Operators", shift: "A", status: "HT", updatedAt: 1 },
      { name: "Sukhdeb", role: "Mixers", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Sonu", role: "Mixers", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Deepak-2", role: "Mixers", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Nilkanth", role: "Mixers", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Himadar", role: "Cutting", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Tikechan", role: "Cutting", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Akash", role: "Cutting", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Sameer", role: "Shifting", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Sashi Pandey", role: "Grinding", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Anuradha", role: "Grinding", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Dhileswar", role: "RUC", shift: "A", status: "HW", updatedAt: 1 },
      { name: "Vijayasree", role: "Others", shift: "A", status: "A", updatedAt: 1 },
      { name: "Banisree", role: "Others", shift: "A", status: "A", updatedAt: 1 },
      { name: "Prakash Mohali", role: "Others", shift: "A", status: "A", updatedAt: 1 }
    ];

    let workers = JSON.parse(localStorage.getItem("hw_v8_roster")) || defaultWorkers;
    let activeMachines = JSON.parse(localStorage.getItem("hw_v8_machines")) || [2, 4];

    function getScriptUrl() {
      return localStorage.getItem("hw_v8_script_url") || DEFAULT_SCRIPT_URL;
    }

    document.getElementById("sheetUrlInput").value = getScriptUrl();

    function saveSheetUrl() {
      const url = document.getElementById("sheetUrlInput").value.trim();
      localStorage.setItem("hw_v8_script_url", url);
      alert("Google Sheet URL saved!");
      syncNow();
    }

    function updateSyncBadge(stateText, cssClass) {
      const btn = document.getElementById("syncBtn");
      btn.textContent = stateText;
      btn.className = `sync-btn ${cssClass || ""}`;
    }

    function saveLocal(markDirty = true) {
      localStorage.setItem("hw_v8_roster", JSON.stringify(workers));
      if (markDirty) {
        hasUnsyncedChanges = true;
        localStorage.setItem("hw_v8_dirty", "true");
        updateSyncBadge("☁️ Sync*", "dirty");
      }
      render();
    }

    // Two-way sync: pushes local edits if dirty, or pulls latest from Google Sheet
    async function syncNow() {
      const url = getScriptUrl();
      if (!url) {
        toggleAdmin();
        alert("Paste your Google Apps Script Web App URL in Settings first.");
        return;
      }

      updateSyncBadge("⏳ Syncing...", "");
      try {
        // 1. Fetch latest remote state
        const getRes = await fetch(url);
        const remoteWorkers = await getRes.json();

        const localMaxTime = Math.max(0, ...workers.map(w => w.updatedAt || 0));
        const remoteMaxTime = Math.max(0, ...remoteWorkers.map(w => w.updatedAt || 0));

        // 2. If local has newer changes (or sheet is empty), push local to Google Sheet
        if (hasUnsyncedChanges || localMaxTime > remoteMaxTime || remoteWorkers.length === 0) {
          await fetch(url, {
            method: "POST",
            body: JSON.stringify({ workers })
          });
          hasUnsyncedChanges = false;
          localStorage.setItem("hw_v8_dirty", "false");
        } else if (remoteWorkers.length > 0) {
          // 3. Otherwise adopt newer changes from Google Sheet
          workers = remoteWorkers;
          localStorage.setItem("hw_v8_roster", JSON.stringify(workers));
          hasUnsyncedChanges = false;
          localStorage.setItem("hw_v8_dirty", "false");
          render();
        }

        updateSyncBadge("✅ Synced", "synced");
      } catch (err) {
        console.error(err);
        updateSyncBadge("⚠️ Offline", "dirty");
      }
    }

    function toggleAdmin() {
      isAdminOpen = !isAdminOpen;
      document.getElementById("adminPanel").classList.toggle("open", isAdminOpen);
      document.getElementById("adminToggle").classList.toggle("active", isAdminOpen);
      document.body.classList.toggle("admin-mode", isAdminOpen);
    }

    function setFilter(f) {
      activeFilter = f;
      localStorage.setItem("hw_v8_filter", f);
      render();
    }

    function toggleWorkerShift(i) {
      workers[i].shift = workers[i].shift === "A" ? "B" : "A";
      workers[i].updatedAt = Date.now();
      saveLocal();
    }

    function toggleMachine(num) {
      activeMachines = activeMachines.includes(num)
        ? activeMachines.filter(n => n !== num)
        : [...activeMachines, num].sort((a, b) => a - b);
      localStorage.setItem("hw_v8_machines", JSON.stringify(activeMachines));
      renderMachines();
    }

    function renderMachines() {
      document.querySelectorAll(".m-btn").forEach(btn => {
        btn.classList.toggle("active", activeMachines.includes(Number(btn.dataset.m)));
      });
    }

    function toggleDayNight() {
      isDayShift = !isDayShift;
      renderDayNightBtn();
    }

    function renderDayNightBtn() {
      document.getElementById("shiftToggle").textContent = isDayShift ? "☀️ Day" : "🌙 Night";
    }

    function setStatus(i, status) {
      workers[i].status = status;
      workers[i].updatedAt = Date.now();
      saveLocal();
    }

    function setRole(i, role) {
      workers[i].role = role;
      workers[i].updatedAt = Date.now();
      saveLocal();
    }

    function editWorkerName(i) {
      const updated = prompt("Edit worker name:", workers[i].name);
      if (updated && updated.trim()) {
        workers[i].name = updated.trim();
        workers[i].updatedAt = Date.now();
        saveLocal();
      }
    }

    function addWorker() {
      const input = document.getElementById("newName");
      const role = document.getElementById("newRole").value;
      const shift = document.getElementById("newShift").value;
      const status = document.getElementById("newStatus").value;
      const name = input.value.trim();
      if (!name) return;

      workers.push({ name, role, shift, status, updatedAt: Date.now() });
      input.value = "";
      saveLocal();
    }

    function removeWorker(i) {
      if (confirm(`Remove ${workers[i].name}?`)) {
        workers.splice(i, 1);
        workers.forEach(w => w.updatedAt = Date.now());
        saveLocal();
      }
    }

    function getVisibleWorkers() {
      return workers
        .map((w, idx) => ({ ...w, idx }))
        .filter(w => activeFilter === "ALL" || w.shift === activeFilter);
    }

    function nonOpCount(status) {
      return getVisibleWorkers().filter(w => w.status === status && w.role !== "Operators").length;
    }

    function render() {
      renderDayNightBtn();
      renderMachines();

      document.querySelectorAll(".f-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.f === activeFilter);
      });

      const summary = [
        nonOpCount("HW") > 0 ? `HW: ${nonOpCount("HW")}` : null,
        nonOpCount("HT") > 0 ? `HT: ${nonOpCount("HT")}` : null,
        nonOpCount("A") > 0 ? `Abs: ${nonOpCount("A")}` : null
      ].filter(Boolean).join(" | ") || "0 non-ops";

      document.getElementById("counts").textContent = summary;

      const visible = getVisibleWorkers();
      const list = document.getElementById("list");

      list.innerHTML = ROLES.map(role => {
        const items = visible.filter(w => w.role === role);
        if (!items.length) return "";

        return `
          <div class="group-title">${role} (${items.length})</div>
          ${items.map(w => `
            <div class="card">
              <div class="card-top">
                <span class="name">${w.name}</span>
                <button class="icon-btn edit-btn" onclick="editWorkerName(${w.idx})" title="Rename">✎</button>
                <button class="badge-shift ${w.shift === 'A' ? 'shift-a' : 'shift-b'}" onclick="toggleWorkerShift(${w.idx})">Shift ${w.shift}</button>
                <select class="role-select" onchange="setRole(${w.idx}, this.value)">
                  ${ROLES.map(r => `<option value="${r}" ${r === w.role ? "selected" : ""}>${r}</option>`).join("")}
                </select>
                <button class="icon-btn del-btn" onclick="removeWorker(${w.idx})" title="Remove">×</button>
              </div>
              <div class="btns">
                <button class="st-btn ${w.status === 'HW' ? 'active-hw' : ''}" onclick="setStatus(${w.idx},'HW')">Hiwood</button>
                <button class="st-btn ${w.status === 'HT' ? 'active-ht' : ''}" onclick="setStatus(${w.idx},'HT')">HiTech</button>
                <button class="st-btn ${w.status === 'A' ? 'active-a' : ''}" onclick="setStatus(${w.idx},'A')">Absent</button>
              </div>
            </div>
          `).join("")}
        `;
      }).join("");
    }

    function getFormattedDate() {
      const val = document.getElementById("shiftDate").value;
      if (!val) return new Date().toLocaleDateString("en-GB");
      const [y, m, d] = val.split("-");
      return `${d}/${m}/${y}`;
    }

    function getMixerHeader() {
      if (!activeMachines.length) return "_Mixers:_";
      const label = activeMachines.length === 1 ? "machine running" : "machines running";
      return `_Mixers (${activeMachines.join(", ")} ${label}):_`;
    }

    function formatSectionBlock(list, useRoleHeaders) {
      let lines = [];
      let counter = 1;

      const ops = list.filter(w => w.role === "Operators");
      if (ops.length) {
        lines.push(`_Operators:_`);
        ops.forEach(w => lines.push(`• ${w.name}`));
      }

      const labourRoles = ROLES.filter(r => r !== "Operators");
      labourRoles.forEach(role => {
        const matched = list.filter(w => w.role === role);
        if (!matched.length) return;

        if (useRoleHeaders) {
          lines.push(role === "Mixers" ? getMixerHeader() : `_${role}:_`);
        }

        matched.forEach(w => {
          lines.push(`${counter++}. ${w.name}`);
        });
      });

      return lines.join("\n");
    }

    function buildSection(status, emoji, title, useRoleHeaders) {
      const list = getVisibleWorkers().filter(w => w.status === status);
      if (list.length <= 0) return null;

      const count = nonOpCount(status);
      const countTag = count > 0 ? ` (${count})` : "";
      return `${emoji} *${title}${countTag}:*\n${formatSectionBlock(list, useRoleHeaders)}`;
    }

    function buildMessage() {
      const date = getFormattedDate();
      const shiftLabel = isDayShift ? "Day" : "Night";
      const subShiftTag = activeFilter === "ALL" ? "" : ` (Shift ${activeFilter})`;

      const blocks = [
        `*Production Manpower allocation ${date} - ${shiftLabel}${subShiftTag}*`,
        buildSection("HW", "✅", "Hiwood", true),
        buildSection("HT", "🏭", "Sent to HiTech", false),
        buildSection("A", "❌", "Absent", false)
      ].filter(Boolean);

      return blocks.join("\n\n");
    }

    function sendWhatsApp() {
      window.open("https://wa.me/?text=" + encodeURIComponent(buildMessage()), "_blank");
    }

    function copyText() {
      navigator.clipboard.writeText(buildMessage()).then(() => alert("Copied to clipboard!"));
    }

    render();
    if (getScriptUrl()) syncNow();
  </script>
</body>

</html>
