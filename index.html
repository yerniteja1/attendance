<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Production Manpower Allocation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
      background: #f1f5f9;
      color: #0f172a;
      padding-bottom: 84px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 6px;
    }

    h2 {
      margin: 0;
      font-size: 1.02rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .date-input {
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 0.74rem;
      background: #fff;
      color: #1e293b;
      font-weight: 600;
      width: 112px;
    }

    .shift-btn {
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      padding: 6px 9px;
      border-radius: 7px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      color: #1e293b;
      white-space: nowrap;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 9px;
    }

    .f-btn {
      border: none;
      background: transparent;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
    }

    .f-btn.active {
      background: #fff;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    .counts {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
    }

    .machines-box {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .machines-label {
      font-size: 0.74rem;
      font-weight: 700;
      color: #64748b;
      margin-right: 2px;
    }

    .m-btn {
      width: 26px;
      height: 26px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      padding: 0;
    }

    .m-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
    }

    .add-row {
      display: flex;
      gap: 5px;
      margin-bottom: 12px;
    }

    input,
    select {
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.82rem;
      background: #fff;
    }

    input#newName {
      flex: 1;
      min-width: 0;
    }

    .add-btn {
      padding: 0 11px;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .group-title {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #64748b;
      margin: 14px 0 6px 2px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 9px 10px;
      margin-bottom: 7px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      gap: 6px;
    }

    .name {
      font-weight: 600;
      font-size: 0.92rem;
      flex: 1;
    }

    .badge-shift {
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }

    .shift-a {
      background: #fef3c7;
      color: #92400e;
      border-color: #fde68a;
    }

    .shift-b {
      background: #e0e7ff;
      color: #3730a3;
      border-color: #c7d2fe;
    }

    .role-select {
      padding: 3px 6px;
      font-size: 0.74rem;
      border-radius: 6px;
      color: #475569;
      background: #f8fafc;
    }

    .del-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .st-btn {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      padding: 6px 4px;
      border-radius: 7px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.76rem;
      color: #334155;
      text-align: center;
    }

    .active-hw {
      background: #16a34a;
      color: #fff;
      border-color: #16a34a;
    }

    .active-ht {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }

    .active-a {
      background: #dc2626;
      color: #fff;
      border-color: #dc2626;
    }

    .actions {
      display: flex;
      gap: 8px;
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 492px;
    }

    .wa-btn {
      flex: 2;
      padding: 13px;
      background: #16a34a;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .copy-btn {
      flex: 1;
      padding: 13px;
      background: #0f172a;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>

<body>
  <div class="header">
    <h2>Manpower</h2>
    <div class="header-controls">
      <input type="date" class="date-input" id="shiftDate" />
      <button class="shift-btn" id="shiftToggle" onclick="toggleDayNight()"></button>
    </div>
  </div>

  <div class="filter-bar">
    <button class="f-btn active" data-f="ALL" onclick="setFilter('ALL')">All Shifts</button>
    <button class="f-btn" data-f="A" onclick="setFilter('A')">Shift A</button>
    <button class="f-btn" data-f="B" onclick="setFilter('B')">Shift B</button>
  </div>

  <div class="meta-bar">
    <div class="counts" id="counts"></div>
    <div class="machines-box">
      <span class="machines-label">Mc:</span>
      <button class="m-btn" data-m="1" onclick="toggleMachine(1)">1</button>
      <button class="m-btn" data-m="2" onclick="toggleMachine(2)">2</button>
      <button class="m-btn" data-m="3" onclick="toggleMachine(3)">3</button>
      <button class="m-btn" data-m="4" onclick="toggleMachine(4)">4</button>
      <button class="m-btn" data-m="5" onclick="toggleMachine(5)">5</button>
    </div>
  </div>

  <div class="add-row">
    <input id="newName" placeholder="Add worker..." onkeydown="if(event.key==='Enter') addWorker()" />
    <select id="newShift">
      <option value="A">Shift A</option>
      <option value="B">Shift B</option>
    </select>
    <select id="newRole"></select>
    <button class="add-btn" onclick="addWorker()">+ Add</button>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button class="wa-btn" onclick="sendWhatsApp()">Send to WhatsApp</button>
    <button class="copy-btn" onclick="copyText()">Copy</button>
  </div>

  <script>
    const ROLES = [
      "Operators",
      "Mixers",
      "Hopping",
      "Cutting",
      "Cleaning",
      "Grinding Cleaning",
      "Floor Cleaning",
      "Maintenance",
      "PVC",
      "WPC",
      "RUC",
      "RUC Sewing Bags",
      "Office Work",
      "Shifting",
      "Grinding",
      "Others"
    ];

    // Display labels (data values stay unchanged so existing workers keep working)
    const ROLE_LABELS = {
      Mixers: "Mixing (M1-5)"
    };

    function roleLabel(role) {
      return ROLE_LABELS[role] || role;
    }

    function renderNewRoleOptions() {
      const sel = document.getElementById("newRole");
      sel.innerHTML = ROLES
        .map(r => `<option value="${r}" ${r === "Mixers" ? "selected" : ""}>${roleLabel(r)}</option>`)
        .join("");
    }

    // Single source of truth: load workers from workers.json
    let workers = [];
    let activeMachines = [2, 4];

    // Fetch workers data from workers.json (the only data source)
    fetch('workers.json')
      .then(response => response.json())
      .then(data => {
        workers = data;
        activeMachines = [];
        render();
      })
      .catch(err => {
        console.error('Failed to load workers.json', err);
        // Fallback to empty state - no hardcoded defaults
        workers = [];
        render();
      });

    const now = new Date();
    const localISO = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().split("T")[0];
    document.getElementById("shiftDate").value = localISO;

    let isDayShift = now.getHours() >= 8 && now.getHours() < 20;
    let activeFilter = localStorage.getItem("hw_v6_filter") || "ALL";

    // Use activeMachines from fetched data (global already declared above)

    function save() {
      localStorage.setItem("hw_v6_roster", JSON.stringify(workers));
      render();
    }

    function setFilter(f) {
      activeFilter = f;
      localStorage.setItem("hw_v6_filter", f);
      render();
    }

    function toggleWorkerShift(i) {
      workers[i][2] = workers[i][2] === "A" ? "B" : "A";
      save();
    }

    function toggleMachine(num) {
      activeMachines = activeMachines.includes(num)
        ? activeMachines.filter(n => n !== num)
        : [...activeMachines, num].sort((a, b) => a - b);
      localStorage.setItem("hw_v6_machines", JSON.stringify(activeMachines));
      renderMachines();
    }

    function renderMachines() {
      document.querySelectorAll(".m-btn").forEach(btn => {
        btn.classList.toggle("active", activeMachines.includes(Number(btn.dataset.m)));
      });
    }

    function toggleDayNight() {
      isDayShift = !isDayShift;
      renderDayNightBtn();
    }

    function renderDayNightBtn() {
      document.getElementById("shiftToggle").textContent = isDayShift ? "☀️ Day" : "🌙 Night";
    }

    function setStatus(i, status) {
      workers[i][3] = status;
      save();
    }

    function setRole(i, role) {
      workers[i][1] = role;
      save();
    }

    function addWorker() {
      const input = document.getElementById("newName");
      const role = document.getElementById("newRole").value;
      const shift = document.getElementById("newShift").value;
      const name = input.value.trim();
      if (!name) return;
      workers.push([name, role, shift, "HW"]);
      input.value = "";
      save();
    }

    function removeWorker(i) {
      if (confirm(`Remove ${workers[i][0]}?`)) {
        workers.splice(i, 1);
        save();
      }
    }

    function getVisibleWorkers() {
      return workers
        .map((w, idx) => ({ name: w[0], role: w[1], shift: w[2], status: w[3], idx }))
        .filter(w => activeFilter === "ALL" || w.shift === activeFilter);
    }

    function nonOpCount(status) {
      return getVisibleWorkers().filter(w => w.status === status && w.role !== "Operators").length;
    }

    function render() {
      renderDayNightBtn();
      renderMachines();

      document.querySelectorAll(".f-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.f === activeFilter);
      });

      const summary = [
        nonOpCount("HW") > 0 ? `HW: ${nonOpCount("HW")}` : null,
        nonOpCount("HT") > 0 ? `HT: ${nonOpCount("HT")}` : null,
        nonOpCount("A") > 0 ? `Abs: ${nonOpCount("A")}` : null
      ].filter(Boolean).join(" | ") || "0 non-ops";

      document.getElementById("counts").textContent = summary;

      const visible = getVisibleWorkers();
      const list = document.getElementById("list");

      list.innerHTML = ROLES.map(role => {
        const items = visible.filter(w => w.role === role);
        if (!items.length) return "";

        return `
          <div class="group-title">${roleLabel(role)} (${items.length})</div>
          ${items.map(w => `
            <div class="card">
              <div class="card-top">
                <span class="name">${w.name}</span>
                <button class="badge-shift ${w.shift === 'A' ? 'shift-a' : 'shift-b'}" onclick="toggleWorkerShift(${w.idx})" title="Tap to switch A/B shift">Shift ${w.shift}</button>
                <select class="role-select" onchange="setRole(${w.idx}, this.value)">
                  ${ROLES.map(r => `<option value="${r}" ${r === w.role ? "selected" : ""}>${roleLabel(r)}</option>`).join("")}
                </select>
                <button class="del-btn" onclick="removeWorker(${w.idx})" title="Remove">×</button>
              </div>
              <div class="btns">
                <button class="st-btn ${w.status === 'HW' ? 'active-hw' : ''}" onclick="setStatus(${w.idx},'HW')">Hiwood</button>
                <button class="st-btn ${w.status === 'HT' ? 'active-ht' : ''}" onclick="setStatus(${w.idx},'HT')">HiTech</button>
                <button class="st-btn ${w.status === 'A' ? 'active-a' : ''}" onclick="setStatus(${w.idx},'A')">Absent</button>
              </div>
            </div>
          `).join("")}
        `;
      }).join("");
    }

    function getFormattedDate() {
      const val = document.getElementById("shiftDate").value;
      if (!val) return new Date().toLocaleDateString("en-GB");
      const [y, m, d] = val.split("-");
      return `${d}/${m}/${y}`;
    }

    function getMixerHeader() {
      if (!activeMachines.length) return "_Mixing (M1-5):_";
      const label = activeMachines.length === 1 ? "machine running" : "machines running";
      return `_Mixing (M1-5) - ${activeMachines.join(", ")} ${label}:_`;
    }

    function formatSectionBlock(list, useRoleHeaders) {
      let lines = [];
      let counter = 1;

      const ops = list.filter(w => w.role === "Operators");
      if (ops.length) {
        lines.push(`_Operators:_`);
        ops.forEach(w => lines.push(`• ${w.name}`));
      }

      const labourRoles = ROLES.filter(r => r !== "Operators");
      labourRoles.forEach(role => {
        const matched = list.filter(w => w.role === role);
        if (!matched.length) return;

        if (useRoleHeaders) {
          lines.push(role === "Mixers" ? getMixerHeader() : `_${roleLabel(role)}:_`);
        }

        matched.forEach(w => lines.push(`${counter++}. ${w.name}`));
      });

      return lines.join("\n");
    }

    function buildSection(status, emoji, title, useRoleHeaders) {
      const list = getVisibleWorkers().filter(w => w.status === status);
      if (list.length <= 0) return null;

      const count = nonOpCount(status);
      const countTag = count > 0 ? ` (${count})` : "";
      return `${emoji} *${title}${countTag}:*\n${formatSectionBlock(list, useRoleHeaders)}`;
    }

    function buildMessage() {
      const date = getFormattedDate();
      const shiftLabel = isDayShift ? "Day" : "Night";
      const subShiftTag = activeFilter === "ALL" ? "" : ` (Shift ${activeFilter})`;

      const blocks = [
        `*Production Manpower allocation ${date} - ${shiftLabel}${subShiftTag}*`,
        buildSection("HW", "✅", "Hiwood", true),
        buildSection("HT", "🏭", "Sent to HiTech", false),
        buildSection("A", "❌", "Absent", false)
      ].filter(Boolean);

      return blocks.join("\n\n");
    }

    function sendWhatsApp() {
      window.open("https://wa.me/?text=" + encodeURIComponent(buildMessage()), "_blank");
    }

    function copyText() {
      navigator.clipboard.writeText(buildMessage()).then(() => alert("Copied to clipboard!"));
    }

    renderNewRoleOptions();
    render();
  </script>
</body>

</html>
